[project]
name = "jev-plays-pokemon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy<2",
    "onnxruntime>=1.30.0",
    "openai>=2.54.0",
    "pillow>=12.3.0",
    "pyboy==2.2.0",
    "pydantic>=2.13.5",
    "rapidocr>=3.9.2",
    "typesafe-sdk>=0.6.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.82",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_plays_pokemon"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src"]

[tool.ty.environment]
root = ["src"]
